name: Deploy to Azure Container Apps

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set deployment variables
        run: |
          echo "RESOURCE_GROUP=${{ vars.AZURE_RESOURCE_GROUP }}" >> "$GITHUB_ENV"
          echo "ACR_NAME=${{ vars.AZURE_ACR_NAME }}" >> "$GITHUB_ENV"
          echo "BACKEND_APP=${{ vars.AZURE_BACKEND_APP }}" >> "$GITHUB_ENV"
          echo "FRONTEND_APP=${{ vars.AZURE_FRONTEND_APP }}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Validate deployment variables
        run: |
          test -n "$RESOURCE_GROUP"
          test -n "$ACR_NAME"
          test -n "$BACKEND_APP"
          test -n "$FRONTEND_APP"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r frontend/requirements.txt

      - name: Run backend tests
        run: python -m pytest backend/tests

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Azure resources exist
        run: |
          az group show --name "$RESOURCE_GROUP" --output none
          az acr show --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --output none
          az containerapp show --name "$BACKEND_APP" --resource-group "$RESOURCE_GROUP" --output none
          az containerapp show --name "$FRONTEND_APP" --resource-group "$RESOURCE_GROUP" --output none

      - name: Build and push backend image
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "investment-strategy-backend:$IMAGE_TAG" \
            --image "investment-strategy-backend:latest" \
            --file deployment/Dockerfile.backend \
            .

      - name: Build and push frontend image
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "investment-strategy-frontend:$IMAGE_TAG" \
            --image "investment-strategy-frontend:latest" \
            --file deployment/Dockerfile.frontend \
            .

      - name: Update backend Container App
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)
          BACKEND_IMAGE="$ACR_LOGIN_SERVER/investment-strategy-backend:$IMAGE_TAG"

          az containerapp update \
            --name "$BACKEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$BACKEND_IMAGE"

      - name: Update frontend Container App
        run: |
          ACR_LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)
          FRONTEND_IMAGE="$ACR_LOGIN_SERVER/investment-strategy-frontend:$IMAGE_TAG"
          BACKEND_FQDN=$(az containerapp show --name "$BACKEND_APP" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn --output tsv)
          BACKEND_URL="https://$BACKEND_FQDN"

          az containerapp update \
            --name "$FRONTEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$FRONTEND_IMAGE" \
            --set-env-vars API_BASE_URL="$BACKEND_URL"

          FRONTEND_FQDN=$(az containerapp show --name "$FRONTEND_APP" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn --output tsv)
          echo "Frontend URL: https://$FRONTEND_FQDN"
